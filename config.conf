# This is a config file, insert all the data here to start the app

[API]
# Your telegram dev account data
API_ID = 'API_ID'  # Get from https://my.telegram.org
API_HASH = 'API_HASH'  # Get from https://my.telegram.org
PHONE = 'PHONE'  # Your phone number with country code, e.g., '+1234567890'

[CHANNEL]
# Channel to analyze
CHANNEL_USERNAME = '@channelusername'  # Can be @username or channel ID

# Data collection interval (in seconds)
# COLLECTION_INTERVAL = 3600  # 1 hour by default